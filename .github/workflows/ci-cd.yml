name: Insurance Quote API CI/CD

on:
  push:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Build Docker image
        run: docker build -t insurance-quote-api .

      - name: Run container and test it responds
        run: |
          docker run -d -p 5000:5000 --name test-container insurance-quote-api
          sleep 3
          curl -f "http://localhost:5000/health"
          docker stop test-container
